<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Christopher Couspeyre — sovereign software, local-first">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0e"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.28" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d8a35f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d8a35f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#e8dcc8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#ground)"/>
  <!-- halo chaud qui respire -->
  <rect width="1200" height="320" rx="16" fill="url(#halo)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#20242c" stroke-width="1.5"/>

  <!-- eyebrow -->
  <g transform="translate(72,74)">
    <rect x="0" y="-11" width="26" height="2" rx="1" fill="#d8a35f"/>
    <text x="40" y="-5" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" letter-spacing="3" fill="#9aa2ad">SOVEREIGN&#160;SOFTWARE&#160;·&#160;LOCAL-FIRST</text>
  </g>

  <!-- nom, serif premium -->
  <text x="70" y="168" font-family="Georgia,'Times New Roman',serif" font-size="66" font-weight="600" fill="url(#name)" letter-spacing="0.5">Christopher Couspeyre</text>

  <!-- ligne d'accent qui se trace -->
  <line x1="72" y1="196" x2="470" y2="196" stroke="#d8a35f" stroke-width="2" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
    <animate attributeName="stroke-dashoffset" values="400;0" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </line>

  <!-- baseline : positionnement -->
  <text x="72" y="236" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="18" fill="#c3cad3">
    Full-stack &amp; systems developer<tspan fill="#4b525c"> — </tspan>Rust<tspan fill="#4b525c"> · </tspan>TypeScript<tspan fill="#4b525c"> · </tspan>Python
  </text>

  <!-- specialité -->
  <text x="72" y="266" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="14" fill="#8b929c">
    Local-first alternatives to costly proprietary software — security, encrypted messaging, on-device AI.
  </text>

  <!-- puce dispo -->
  <g transform="translate(72,296)">
    <circle cx="5" cy="-4" r="4" fill="#4ac97e">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="0" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" fill="#9aa2ad">Available for remote engineering roles</text>
  </g>

  <!-- handle discret -->
  <text x="1128" y="300" text-anchor="end" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" fill="#565d67">github.com/chrlstopher-c</text>
</svg>
